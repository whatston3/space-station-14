- type: constructionGraph
  id: DetonatorGraph
  start: start
  graph:
  - node: start
    edges:
    - to: emptyDetonator
      steps:
      - material: Bananium
        amount: 1
        doAfter: 1

  - node: emptyDetonator
    entity: EmptyDetonator
    actions:
    - !type:AppearanceChange
    edges:
    # forwards
    - to: detonatorWithTrigger
      steps: &payloadSteps
      - component: PayloadTrigger
        store: payloadTrigger
        name: construction-graph-component-payload-trigger
        doAfter: 0.5
    - to: detonatorWithWire
      steps: &wireSteps
      - material: CableDet
        doAfter: 0.5

  - node: detonatorWithTrigger
    actions:
    - !type:AppearanceChange
    - !type:PlaySound
      sound: /Audio/Machines/button.ogg
    - !type:TriggerEntity
      trigger: deconstructed
    edges:
    # back
    - to: emptyDetonator
      steps: &payloadDeconstructSteps
      - tool: Prying
        doAfter: 0.5
        completed:
        - !type:EmptyContainer
          container: payloadTrigger
    # forwards
    - to: wiredDetonator
      steps: *wireSteps

  - node: detonatorWithWire
    actions:
    - !type:AppearanceChange
    - !type:PlaySound
      sound: /Audio/Machines/button.ogg
    - !type:TriggerEntity
      trigger: deconstructed
    edges:
    # back
    - to: emptyDetonator
      steps: &wireDeconstructSteps
      - tool: Cutting
        doAfter: 0.5
        completed:
        - !type:SpawnPrototype
          prototype: CableDetStack1
    # forwards
    - to: wiredDetonator
      steps: *payloadSteps

  - node: wiredDetonator
    actions:
    - !type:AppearanceChange
    - !type:PlaySound
      sound: /Audio/Machines/button.ogg
    - !type:TriggerEntity
      trigger: constructed
    - !type:AdminLog
      message: "A detonator cap was crafted"
    edges:
    # back
    - to: detonatorWithTrigger
      steps: *wireDeconstructSteps
    - to: detonatorWithWire
      steps: *payloadDeconstructSteps
