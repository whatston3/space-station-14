- type: entity
  abstract: true
  parent: Clothing
  id: IDCardStandard
  name: identification card
  description: A card necessary to access various areas aboard the station.
  components:
  - type: Sprite
    sprite: Objects/Misc/id_cards.rsi
  - type: Clothing
    slots:
    - idcard
    sprite: Objects/Misc/id_cards.rsi
  - type: Item
    size: Small
    heldPrefix: default
    storedRotation: -90
  - type: Access
  - type: IdCard
  - type: StationRecordKeyStorage
  - type: Tag
    tags:
    - DoorBumpOpener
    - WhitelistChameleon
    - WhitelistChameleonIdCard
  - type: StealTarget
    stealGroup: IDCard

- type: entity
  abstract: true
  id: BaseIDCardAppearance
  components:
  - type: Appearance
  - type: Sprite
    layers:
    - map: [enum.IdCardVisualLayers.Base]
    - map: [enum.IdCardVisualLayers.TopStripe]
    - map: [enum.IdCardVisualLayers.BottomStripe]
    - sprite: Interface/Misc/job_icons.rsi
      offset: -0.09375, 0.0625 # 3 pixels left, 2 pixels up
      map: [enum.IdCardVisualLayers.JobIcon]
  - type: IdCardVisuals

- type: entity
  abstract: true
  parent: BaseIDCardAppearance
  id: StripedIDCardAppearance
  components:
  - type: IdCardVisuals
    baseState: default
    stripeTopState: stripe_top
    stripeBottomState: stripe_bottom

